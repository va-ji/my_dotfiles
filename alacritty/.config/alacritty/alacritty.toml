[window]
# 1.0 = solid, 0.0 = invisible. Only the background fades; text stays solid.
# Sway composites this itself, so no separate compositor is needed.
opacity = 0.80

[font]
size = 11.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"
