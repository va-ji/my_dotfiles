[window]
# 1.0 = solid, 0.0 = invisible. Only the background fades; text stays solid.
# Sway composites this itself, so no separate compositor is needed.
opacity = 0.80

[font]
size = 11.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

# Super+N -> send Alt+N (ESC N) so tmux's M-N window binds work.
# Sway owns Alt (Mod1), and tmux can't see the Super key directly.
[keyboard]
bindings = [
  { key = "1", mods = "Super", chars = "\u001b1" },
  { key = "2", mods = "Super", chars = "\u001b2" },
  { key = "3", mods = "Super", chars = "\u001b3" },
  { key = "4", mods = "Super", chars = "\u001b4" },
  { key = "5", mods = "Super", chars = "\u001b5" },
  { key = "6", mods = "Super", chars = "\u001b6" },
  { key = "7", mods = "Super", chars = "\u001b7" },
  { key = "8", mods = "Super", chars = "\u001b8" },
  { key = "9", mods = "Super", chars = "\u001b9" },
  { key = "0", mods = "Super", chars = "\u001b0" },
]
